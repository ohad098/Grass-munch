<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#22324a">
    <title>Grass Munch</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="preload" href="TemplateData/GrassMunch.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>
    </div>

    <!-- The loading screen. Plain HTML/CSS, so it shows the moment the page opens. -->
    <div id="loader" role="progressbar" aria-label="Loading Grass Munch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="drift" aria-hidden="true"></div>
      <div class="loader-column">
        <h1 class="title" aria-label="Grass Munch">
          <span class="word word-a">GRASS</span>
          <span class="word word-b">MUNCH</span>
        </h1>
        <p class="tagline">Swap the munchers. Clear the lawn.</p>

        <div class="lawn" aria-hidden="true">
          <div class="tiles"></div>
          <div class="muncher">
            <svg viewBox="0 0 100 100" class="muncher-svg">
              <ellipse class="m-shadow" cx="50" cy="95" rx="34" ry="5"/>
              <g class="m-body">
                <path class="m-skin" d="M50 12 C80 12 90 22 90 52 C90 82 80 90 50 90 C20 90 10 82 10 52 C10 22 20 12 50 12 Z"/>
                <path class="m-shine" d="M28 26 C34 20 44 19 50 19 C40 22 33 27 29 36 Z"/>
                <g class="m-eye m-eye-l"><circle cx="35" cy="43" r="13"/><circle class="m-pupil" cx="38" cy="45" r="6"/></g>
                <g class="m-eye m-eye-r"><circle cx="65" cy="43" r="13"/><circle class="m-pupil" cx="68" cy="45" r="6"/></g>
                <ellipse class="m-mouth" cx="52" cy="66" rx="6" ry="4"/>
              </g>
            </svg>
          </div>
        </div>

        <div class="status">
          <span class="status-text">Mowing the lawn…</span>
          <span class="status-pct">0%</span>
        </div>
        <p class="tip"><span class="tip-label">TIP</span><span class="tip-text"></span></p>
      </div>

      <div class="failure" hidden>
        <div class="failure-card">
          <div class="failure-title">The munchers got lost on the way</div>
          <p class="failure-text">The game couldn't load. Check your connection and try again.</p>
          <button type="button" class="failure-retry" onclick="location.reload()">Try again</button>
          <p class="failure-detail"></p>
        </div>
      </div>
    </div>

    <div id="toasts" aria-live="polite"></div>

    <script src="TemplateData/loader-screen.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/012305de899ecdfc651429c7480bae61.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/cce0f737503eadfc9f0926e12353279f.data.unityweb",
        frameworkUrl: buildUrl + "/d3e40dccab3db1f187b11ccb4f642833.framework.js.unityweb",
        codeUrl: buildUrl + "/c546fe792ceb64f19836f66b192d472f.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Grass Munch",
        productVersion: "1.0",
        showBanner: LoaderScreen.banner,
      };

      LoaderScreen.fitCanvas(canvas, 540, 960);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = function () { LoaderScreen.fail("The game files could not be downloaded."); };
      script.onload = function () {
        createUnityInstance(canvas, config, LoaderScreen.progress).then(function (unityInstance) {
          LoaderScreen.done();
        }).catch(function (message) {
          LoaderScreen.fail(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
